# HomeGuard Configuration
# Home Network Gateway for Parental Control and Proxy Management

[general]
# Log level: trace, debug, info, warn, error
log_level = "info"
# Data directory for SQLite database
data_dir = "/var/lib/homeguard"

[dns]
# DNS server listen address
# Use 127.0.0.1:5353 for production (PF redirects to this port)
# Use 0.0.0.0:53 for direct DNS server mode
listen = "127.0.0.1:5353"
# Upstream DNS servers
upstream = [
    "8.8.8.8:53",
    "223.5.5.5:53",
]
# Enable FakeDNS for transparent proxy
fake_dns = true
# FakeDNS IP pool (198.18.0.0/15 is reserved for documentation)
fake_dns_pool = "198.18.0.0/15"
# DNS cache size
cache_size = 10000
# DNS cache TTL in seconds
cache_ttl = 300

[transparent]
# Transparent proxy listen address
# Use 127.0.0.1:7893 for production (PF redirects to this port)
listen = "127.0.0.1:7893"

[proxy]
# Shadowsocks proxies (one upstream per region; underlying server identifiers).
# Replace `server`, `port`, `password`, `method` with your real provider details.
[[proxy.shadowsocks]]
name = "ss-hk-1"
server = "hk.example.com"
port = 8388
password = "your-hk-password"
method = "chacha20-ietf-poly1305"

[[proxy.shadowsocks]]
name = "ss-us-1"
server = "us.example.com"
port = 8388
password = "your-us-password"
method = "chacha20-ietf-poly1305"

# Proxy groups are what `rules.list` references (policy names must match here
# in upper-case — see Policy::from_str). One group per region; if you add more
# servers later (e.g. ss-hk-2), append them to `proxies` and pick `url-test`
# to auto-select the lowest-latency one.
[[proxy.group]]
name = "SS-HK"
type = "select"
proxies = ["ss-hk-1"]

[[proxy.group]]
name = "SS-US"
type = "select"
proxies = ["ss-us-1"]

[rules]
# Main rule entry file (relative paths resolve against this config file).
# Rules change much more often than infrastructure settings, so they live in
# a plain-text file — one rule per line, `#` for comments, easy to diff/version.
rule_file = "./rules.list"
# Root directory for RULE-SET sub-files referenced from rule_file.
# Lets you split rules.list into themed pieces, e.g. inside rules.list:
#   RULE-SET,proxy-ai.list,SS-US
#   RULE-SET,direct-cn.list,DIRECT
# would look up `<rules_dir>/proxy-ai.list` and `<rules_dir>/direct-cn.list`.
rules_dir = "./rules"
# GeoIP database path (optional, enables GEOIP rules)
# geoip_db = "./data/GeoLite2-Country.mmdb"

# ─────────────────────────────────────────────────────────────────────────────
# Device configurations (parental control — first-boot seed only)
# ─────────────────────────────────────────────────────────────────────────────
# As of v2 (grant-based parental control), this section is read **only on
# the first run** when the SQLite `devices` table is empty. After seeding,
# the SQLite table is authoritative; further edits here are ignored (a
# warning is logged). Add/remove/edit devices via `sqlite3` after first boot —
# see docs/parental-control.md for SQL cookbook.
#
# Two blocklist tiers per device:
#   hard_blocklists      — always blocked, no grant can override
#                          (e.g. porn / violence — categories under
#                          blocklists/categories/<name>.list that match
#                          something the kid should NEVER reach)
#   grantable_blocklists — blocked by default; an active row in the SQLite
#                          `grants` table (issued by the parent via
#                          `INSERT INTO grants ...`) temporarily allows
#                          access until expires_at
#
# Daily-life flow:
#   1. Kid asks the parent: "can I play games for an hour?"
#   2. Parent runs from the Mac mini's shell:
#        sqlite3 /var/lib/homeguard/config.db \
#          "INSERT INTO grants (device_id, category, expires_at) \
#           VALUES ('child_ipad', 'games', datetime('now', '+1 hour'));"
#   3. Within 5 seconds (cache refresh window), the kid's iPad can reach
#      games sites. After 1 hour, it's blocked again automatically.

# [devices.child_ipad]
# ip   = "192.168.0.50"
# mac  = "AA:BB:CC:DD:EE:FF"
# name = "Child iPad"
# device_type = "child"
# hard_blocklists      = ["porn", "violence"]
# grantable_blocklists = ["games", "social"]

# [devices.parent_phone]
# ip   = "192.168.0.30"
# name = "Parent iPhone"
# device_type = "adult"     # Adult devices bypass all blocklists

# Parental control settings
[parental]
# Enable parental control
enabled = false
# Blocklist directory (relative to config file or absolute path)
blocklist_dir = "blocklists"
# Global categories blocked for ALL devices (including adults)
global_categories = []
# Default policy for unknown devices: "allow", "block_if_listed", "block_all"
default_policy = "allow"
# Log blocked requests
log_blocked = true

# Storage settings
[storage]
# SQLite database path for configuration storage
database = "/var/lib/homeguard/config.db"

# Logging settings
[logging]
# Access log directory
log_dir = "/var/lib/homeguard/logs"
# Log granularity: 1=all, 2=blocked+proxy, 3=blocked only
granularity = 2
# Log retention in days (0 = keep forever)
retention_days = 30
