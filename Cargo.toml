[package]
name = "homeguard"
version = "0.1.0"
edition = "2021"
authors = ["HomeGuard Team"]
description = "A home network gateway for parental control and proxy management"
license = "MIT"
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# DNS - use simple-dns for basic DNS parsing
simple-dns = "0.7"

# Crypto
ring = "0.17"
md-5 = "0.10"   # For EVP_BytesToKey compatibility

# Pattern matching
aho-corasick = "1.1"
radix_trie = "0.2"
regex = "1.10"

# Network
ipnet = "2.7"
socket2 = { version = "0.5", features = ["all"] }
bytes = "1.5"
libc = "0.2"

# GeoIP
maxminddb = "0.24"

# Serialization
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async trait
async-trait = "0.1"

# Concurrency
dashmap = "5.5"
parking_lot = "0.12"
once_cell = "1.19"

# File watching (config hot reload)
notify = "6.1"

# LRU cache
lru = "0.12"

# Force older versions of transitive deps for Rust 1.83 compatibility
indexmap = ">=2.6, <2.8"
hashbrown = ">=0.14, <0.16"

[dev-dependencies]
tokio-test = "0.4"
tempfile = ">=3.10, <3.15"
